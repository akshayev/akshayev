# Projects shown on the profile. One [[project]] block per project.
#
# TO ADD A PROJECT: copy a block, fill it in, and push. The GitHub Action
# rebuilds the card (assets/projects/<slug>.svg) and the grid in README.md.
# To preview locally: python3 scripts/build_projects.py
#
# Rules of thumb:
#   - 2 or 3 metrics per project, each specific to THAT project.
#   - Only use numbers you can point to in the project's own repo or README.
#   - Keep description to about 2-3 short lines.
#   - color is optional: sky, emerald, amber, violet, rose.

[[project]]
slug = "ghost-data-deletion-audit-agent"
name = "Ghost Data Deletion-Audit Agent"
kind = "AI agent"
url = "https://github.com/akshayev/ghost-data-deletion-audit-agent"
description = "Checks 518 data-deletion requests against messy evidence and reports what still exists. LLMs only handle narrow jobs, behind validation."
stack = ["Python", "pytest", "LLM validation gates"]
color = "amber"
metrics = [
  { value = "#28", label = "of 4,094 in Orchestrate hackathon" },
  { value = "375", label = "automated tests" },
  { value = "100%", label = "status accuracy, 32 sample cases" },
]

