<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="By the numbers">
  <style>
    .n { font: 800 40px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .l { font: 500 13px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
    .tile { opacity: 0; animation: up .7s ease-out forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .tile { animation: none; opacity: 1; } }
  </style>
  <g class="tile" style="animation-delay:.05s">
    <rect x="0.5" y="0.5" width="213" height="149" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <text x="22" y="66" class="n" fill="#fbbf24">#28</text>
    <text x="22" y="96" class="l">of 4,094 participants</text>
    <text x="22" y="116" class="l">HackerRank Orchestrate</text>
  </g>
  <g class="tile" style="animation-delay:.2s">
    <rect x="228.5" y="0.5" width="213" height="149" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <text x="250" y="66" class="n" fill="#34d399">375</text>
    <text x="250" y="96" class="l">automated tests</text>
    <text x="250" y="116" class="l">behind the audit agent</text>
  </g>
  <g class="tile" style="animation-delay:.35s">
    <rect x="456.5" y="0.5" width="213" height="149" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <text x="478" y="66" class="n" fill="#38bdf8">100%</text>
    <text x="478" y="96" class="l">deletion-status accuracy</text>
    <text x="478" y="116" class="l">on 32 public sample cases</text>
  </g>
  <g class="tile" style="animation-delay:.5s">
    <rect x="684.5" y="0.5" width="215" height="149" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <text x="706" y="66" class="n" fill="#a78bfa">518</text>
    <text x="706" y="96" class="l">deletion requests audited</text>
    <text x="706" y="116" class="l">end to end by one agent</text>
  </g>
</svg>
