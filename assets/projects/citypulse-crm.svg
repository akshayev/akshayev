<svg xmlns="http://www.w3.org/2000/svg" width="440" height="252" viewBox="0 0 440 252" role="img" aria-label="CityPulse CRM: Lead-gen CRM on a Bronze, Silver, Gold pipeline with data-quality gates, a dead-letter queue, provider fallbacks and daily cost quotas.">
<style>
