<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="t d">
  <title id="t">Akshay EV</title>
  <desc id="d">Data Engineer. Data pipelines and AI agents in Python and SQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <style>
      .name { font: 700 50px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; }
      .role { font: 500 21px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #cbd5e1; }
      .meta { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7dd3fc; }
      .lbl  { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <rect x="48" y="132" width="64" height="3" rx="1.5" fill="#38bdf8"/>

  <text x="48" y="84" class="name">Akshay EV</text>
  <text x="48" y="116" class="role">Data Engineer · Data pipelines and AI agents</text>
  <text x="48" y="166" class="meta">Python · SQL · PostgreSQL · LLM systems</text>

  <!-- Bronze -> Silver -> Gold -->
  <g transform="translate(610 72)">
    <line x1="30" y1="28" x2="110" y2="28" stroke="#334155" stroke-width="2"/>
    <line x1="150" y1="28" x2="230" y2="28" stroke="#334155" stroke-width="2"/>
    <circle cx="20"  cy="28" r="12" fill="#b45309"/>
    <circle cx="130" cy="28" r="12" fill="#94a3b8"/>
    <circle cx="240" cy="28" r="12" fill="#eab308"/>
    <text x="20"  y="66" text-anchor="middle" class="lbl">bronze</text>
    <text x="130" y="66" text-anchor="middle" class="lbl">silver</text>
    <text x="240" y="66" text-anchor="middle" class="lbl">gold</text>
  </g>
</svg>
