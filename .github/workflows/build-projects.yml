name: Build project cards

on:
  push:
    paths:                    # when a project is added or edited: rebuild the cards
      - "projects.toml"
      - "scripts/build_projects.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build project cards and grid
        run: python3 scripts/build_projects.py
      - name: Commit if changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild project cards"
          git push
