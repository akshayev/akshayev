name: Refresh profile

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours: refresh the activity card
  push:
    paths:                    # when a project is added or edited: rebuild the cards
      - "projects.toml"
      - "scripts/build_projects.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build project cards and grid
        run: python3 scripts/build_projects.py
      - name: Refresh the activity card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_activity.py
      - name: Commit if changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile"
          git push
