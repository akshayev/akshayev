name: Update consistency card

# Publishes dist/stats.svg to the `output` branch as a single force-pushed
# commit, so main's history never fills up with bot commits.
# Runs every 3 hours so the card stays close to the live profile total (a daily
# run left it up to a day behind). Minute 17 is deliberate: GitHub delays
# top-of-the-hour scheduled runs the most.
on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths:
      - "scripts/build_stats.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build card
        run: python3 scripts/build_stats.py dist/stats.svg
      - name: Publish to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git add stats.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update consistency card"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" output
